apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-web-and-lb
spec:
  podSelector:
    matchLabels: { app: api }      # this policy protects the api pods
  policyTypes: [Ingress]           # controls incoming traffic only
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: web }       # nginx's /api proxy
        - ipBlock: { cidr: 130.211.0.0/22 } # Google load balancer
        - ipBlock: { cidr: 35.191.0.0/16 }  # Google load balancer and health checks
      ports:
        - port: 3000
          protocol: TCP
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: issueboard
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: issueboard
spec:
  parentRefs:
    - name: issueboard
  rules:
    - matches:
        - path: { type: PathPrefix, value: /api }
      backendRefs:
        - name: api
          port: 3000
    - matches:
        - path: { type: PathPrefix, value: / }
      backendRefs:
        - name: web
          port: 80
---
# The load balancer checks "/" by default; the API answers 404 there, so point it at /healthz
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: api-health
spec:
  default:
    config:
      type: HTTP
      httpHealthCheck:
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: api

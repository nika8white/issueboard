services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: issueboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:-issueboard}
      POSTGRES_DB: issueboard
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issueboard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      target: dev  
    environment:
      DB_HOST: db
      DB_USER: issueboard
      DB_PASSWORD: ${DB_PASSWORD:-issueboard}
      DB_NAME: issueboard
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    develop:
      watch:
        - action: sync       # copy changed files into the running container
          path: ./api/src
          target: /app/src
        - action: rebuild    # new dependencies still need a rebuild
          path: ./api/package.json

  web:
    build: ./web
    depends_on:
      - api
    ports:
      - "8080:8080"
    develop:
      watch:
        - action: rebuild
          path: ./web/src
        - action: rebuild
          path: ./web/package.json

  adminer:
    image: adminer
    depends_on:
      - db
    ports:
      - "8082:8080"

volumes:
  dbdata:
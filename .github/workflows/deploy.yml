name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write          # lets the job request a GitHub OIDC token for WIF

concurrency:
  group: deploy-production
  cancel-in-progress: false   # never kill a deploy halfway through

env:
  AR: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/issueboard

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push images tagged with the commit SHA
        run: |
          docker build -t "$AR/api:$GITHUB_SHA" --build-arg APP_VERSION="$GITHUB_SHA" ./api
          docker build -t "$AR/web:$GITHUB_SHA" ./web
          docker push "$AR/api:$GITHUB_SHA"
          docker push "$AR/web:$GITHUB_SHA"

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production   # pauses here until you approve
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GCP_REGION }}
      - name: Point the overlay at this commit's images
        working-directory: k8s/overlays/gke
        run: kustomize edit set image issueboard-api=$AR/api:$GITHUB_SHA issueboard-web=$AR/web:$GITHUB_SHA
      - run: kubectl apply -k k8s/overlays/gke
      - name: Wait for the rollout
        run: |
          kubectl -n issueboard rollout status deployment/api --timeout=5m
          kubectl -n issueboard rollout status deployment/web --timeout=5m
      - name: Smoke test through the load balancer
        run: |
          IP=$(kubectl -n issueboard get gateway issueboard -o jsonpath='{.status.addresses[0].value}')
          for i in $(seq 1 12); do
            curl -fsS "http://$IP/api/version" | grep -q "$GITHUB_SHA" && echo "live" && exit 0
            sleep 10
          done
          echo "new version not served"; exit 1